name: Build

# Runs scripts/release/package.sh, the same script used for local release builds: unit tests, app build,
# library bundling, and the bundle check. Pull requests keep the zip as an artifact for 7 days; a v* tag
# publishes it as a GitHub release. macOS minutes count 10x against the free quota, so documentation-only
# changes do not trigger a build.

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write # tag builds publish the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # package.sh --publish checks that the tagged commit is on a pushed branch

      - name: Install dependencies
        run: brew install librime xcodegen pkgconf

      - name: Cache the rime-ice tables
        uses: actions/cache@v4
        with:
          path: build/rime-data/rime-ice
          key: rime-ice-${{ hashFiles('scripts/rime/fetch-rime-ice.sh') }}

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(awk '/MARKETING_VERSION:/ {print $2}' project.yml)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version in project.yml"
            exit 1
          fi

      - name: Build and package
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: scripts/release/package.sh

      - name: Build, package, and publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/package.sh --publish

      - name: Upload the package
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: LinguaType-macOS-arm64
          path: build/release.noindex/*.zip
          retention-days: 7
          compression-level: 0 # already a zip
